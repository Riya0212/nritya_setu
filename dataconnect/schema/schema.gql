type User @table {
  displayName: String!
  email: String!
  role: String!
  createdAt: Timestamp!
  photoUrl: String
  bio: String
  contactInfo: String
}

type Course @table {
  title: String!
  description: String!
  difficultyLevel: String!
  createdAt: Timestamp!
  thumbnailUrl: String
  price: Float
  guru: User!
}

type Lesson @table {
  title: String!
  content: String!
  orderInCourse: Int!
  lessonType: String!
  createdAt: Timestamp!
  videoUrl: String
  audioUrl: String
  textContent: String
  course: Course!
}

type Submission @table {
  submissionUrl: String!
  submittedAt: Timestamp!
  status: String!
  guruFeedback: String
  grade: Int
  student: User!
  lesson: Lesson!
}

type Enrollment @table(key: ["student", "course"]) {
  enrolledAt: Timestamp!
  status: String!
  completedAt: Timestamp
  student: User!
  course: Course!
}